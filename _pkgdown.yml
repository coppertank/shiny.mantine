url: https://aldocaumo.github.io/shiny.mantine/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: "shiny.mantine — Mantine UI for Shiny"

development:
  mode: auto

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started.html
      - text: Architecture
        href: articles/architecture.html
      - text: Satellite packages
        href: articles/satellite-packages.html
      - text: Component gallery
        href: articles/component-gallery.html

reference:
- title: "Provider"
  desc: >
    The one component every UI must wrap everything in — supplies theme
    and color-scheme context to every other component.
  contents:
