- title: "Reactive architecture"
  desc: >
    The two mechanisms that go beyond simple one-way rendering: a generic
    prop-update channel and a `renderUI()`-equivalent reactive output. See
    `vignette("architecture")`.
  contents:
  - updateMantineProps
  - mantineOutput
  - renderMantine
  - mantineDependency

- title: "Icons"
  desc: "Re-exported `@tabler/icons-react` icons used by the example apps and available for your own UIs."
  contents:
  - starts_with("Icon")
